<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leanna</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    
    #videoContainer {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    
    #splashVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="videoContainer">
    <video id="splashVideo" autoplay muted loop>
      <source src="../assets/video.mp4" type="video/mp4">
    </video>
  </div>
  
  <script>
    const video = document.getElementById('splashVideo');
    let splashReady = false;
    
    video.addEventListener('canplay', () => {
      splashReady = true;
      video.play().catch(() => {
        setTimeout(() => {
          if (typeof window.onSplashFinished === "function") {
            window.onSplashFinished();
          }
        }, 5000);
      });
    });
    
    setTimeout(() => {
      if (!splashReady) {
        if (typeof window.onSplashFinished === "function") {
          window.onSplashFinished();
        }
      }
    }, 5000);
    
    video.addEventListener('ended', () => {
      if (typeof window.onSplashFinished === "function") {
        window.onSplashFinished();
      }
    });
    
    document.addEventListener('click', () => {
      if (typeof window.onSplashFinished === "function") {
        window.onSplashFinished();
      }
    });
    
    document.addEventListener('keydown', () => {
      if (typeof window.onSplashFinished === "function") {
        window.onSplashFinished();
      }
    });
  </script>
</body>
</html>
