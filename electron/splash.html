<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Jarvis OS · Boot</title>

  <script>
    (function() {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (_) {}
      if (theme !== "dark" && theme !== "light") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <style>
    /* ===== RESET & DESIGN TOKENS (aligned with main app) ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;

      --bg-base: #0a0a0f;
      --bg-panel: rgba(17, 17, 24, 0.92);
      --bg-elevated: #1a1a24;
      --bg-input: rgba(32, 32, 44, 0.55);

      --border-base: rgba(55, 55, 75, 0.5);
      --border-strong: rgba(75, 75, 100, 0.7);
      --border-focus: rgba(99, 102, 241, 0.6);

      --text-primary: #f0f0f5;
      --text-secondary: #b4b4c8;
      --text-muted: #8888a4;
      --text-dimmed: #5c5c74;

      --accent-primary: #818cf8;
      --accent-hover: #a5b4fc;
      --accent-subtle: rgba(129, 140, 248, 0.12);
      --accent-glow: rgba(129, 140, 248, 0.4);
      --accent-secondary: #06b6d4;

      --color-success: #4ade80;
      --color-warning: #fcd34d;
      --color-error: #fb7185;

      --shadow-md: 0 4px 16px rgba(0,0,0,0.4), 0 2px 6px rgba(2,6,23,0.3);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.5), 0 4px 16px rgba(2,6,23,0.3);
      --shadow-glow: 0 0 20px rgba(99,102,241,0.15), 0 0 60px rgba(99,102,241,0.05);

      --glass-bg: rgba(17, 17, 24, 0.75);
      --glass-border: rgba(99, 102, 241, 0.1);
      --glass-blur: 16px;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 10px;
      --radius-2xl: 12px;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    :root[data-theme="light"] {
      --bg-base: #ffffff;
      --bg-panel: rgba(255, 255, 255, 0.92);
      --bg-elevated: #ecedf4;
      --bg-input: rgba(235, 236, 244, 0.7);

      --border-base: rgba(180, 185, 210, 0.45);
      --border-strong: rgba(150, 155, 185, 0.6);
      --border-focus: rgba(99, 102, 241, 0.5);

      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #6b7280;
      --text-dimmed: #9ca3af;

      --accent-primary: #4f46e5;
      --accent-hover: #4338ca;
      --accent-subtle: rgba(79, 70, 229, 0.08);
      --accent-glow: rgba(79, 70, 229, 0.2);
      --accent-secondary: #0891b2;

      --color-success: #22c55e;
      --color-warning: #eab308;
      --color-error: #ef4444;

      --shadow-md: 0 4px 16px rgba(99,102,241,0.06), 0 2px 6px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 36px rgba(99,102,241,0.08), 0 4px 12px rgba(0,0,0,0.06);
      --shadow-glow: 0 0 16px rgba(99,102,241,0.08), 0 0 48px rgba(99,102,241,0.03);

      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(99, 102, 241, 0.08);
      --glass-blur: 16px;
    }

    /* ===== BODY ===== */
    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-mono);
      color: var(--text-primary);
      user-select: none;
      -webkit-app-region: drag;
      background: transparent;
    }

    /* Subtle grid background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, var(--accent-subtle) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== MAIN PANEL ===== */
    .panel {
      position: relative;
      width: 440px;
      max-width: 96vw;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 28px 28px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      z-index: 1;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: var(--radius-lg);
      background: var(--bg-elevated);
      padding: 4px;
      border: 1px solid var(--border-base);
    }

    .brand-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    .brand-sub {
      font-size: 9px;
      letter-spacing: 1.8px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--accent-subtle);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      font-size: 9px;
      letter-spacing: 0.5px;
      color: var(--accent-primary);
      font-family: var(--font-mono);
      font-weight: 500;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      background: var(--accent-primary);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-glow);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* ===== ORB SECTION — central visual identity ===== */
    .orb-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 0;
    }

    .orb {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--accent-hover), var(--accent-primary) 50%, #4f46e5 100%);
      box-shadow:
        0 0 24px var(--accent-glow),
        0 0 60px rgba(129, 140, 248, 0.15),
        inset 0 -4px 12px rgba(0,0,0,0.3);
      animation: orb-breathe 3s ease-in-out infinite;
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      animation: orb-ring 3s ease-in-out infinite;
      opacity: 0.5;
    }

    .orb::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 16px;
      width: 18px;
      height: 10px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      filter: blur(3px);
    }

    .orb.complete {
      background: radial-gradient(circle at 35% 35%, #86efac, var(--color-success) 50%, #16a34a 100%);
      box-shadow:
        0 0 24px rgba(74, 222, 128, 0.4),
        0 0 60px rgba(74, 222, 128, 0.15),
        inset 0 -4px 12px rgba(0,0,0,0.3);
      animation: orb-breathe 2s ease-in-out infinite;
    }

    .orb.complete::before {
      background: radial-gradient(circle, rgba(74, 222, 128, 0.4), transparent 70%);
    }

    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes orb-ring {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.6; }
    }

    /* ===== DIVIDER ===== */
    .divider {
      height: 1px;
      background: var(--border-base);
      border: none;
    }

    /* ===== LOG ===== */
    .log {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 140px;
      max-height: 140px;
      overflow-y: hidden;
    }

    .log-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      color: var(--text-dimmed);
      opacity: 0;
      animation: reveal 0.2s var(--ease-out) forwards;
      padding: 3px 6px;
      border-radius: var(--radius-sm);
      transition: background 0.2s, color 0.2s;
    }

    .log-row.active {
      color: var(--text-primary);
      background: var(--accent-subtle);
    }

    .log-row.done {
      color: var(--text-secondary);
    }

    .log-icon {
      width: 14px;
      font-size: 10px;
      text-align: center;
      color: var(--text-dimmed);
      flex-shrink: 0;
    }
    .log-row.active .log-icon { color: var(--accent-primary); }
    .log-row.done .log-icon { color: var(--color-success); }

    .log-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-status {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--text-dimmed);
      text-transform: uppercase;
    }
    .log-status.ok { color: var(--color-success); }
    .log-status.running {
      color: var(--accent-primary);
      animation: pulse-text 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulse-text {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== PROGRESS ===== */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
    }

    .progress-label {
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-weight: 400;
    }
    .progress-label .accent {
      color: var(--accent-primary);
      font-weight: 500;
    }

    .progress-pct {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 600;
    }

    .progress-track {
      height: 4px;
      background: var(--bg-elevated);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-base);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 4px;
      transition: width 0.4s var(--ease-out);
      position: relative;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 1.5s linear infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    /* ===== METRICS ===== */
    .metrics {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-lg);
      font-size: 9px;
      font-family: var(--font-mono);
      color: var(--text-dimmed);
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-label {
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .metric-bar {
      width: 44px;
      height: 3px;
      background: var(--border-base);
      border-radius: 3px;
      overflow: hidden;
    }

    .metric-bar .fill {
      height: 100%;
      width: 0%;
      background: var(--accent-primary);
      border-radius: 3px;
      transition: width 0.8s var(--ease-out);
    }

    .metric .value {
      color: var(--text-secondary);
      font-weight: 600;
      min-width: 24px;
    }

    /* ===== FOOTER ===== */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.5px;
      letter-spacing: 0.5px;
      color: var(--text-dimmed);
      font-family: var(--font-mono);
      padding-top: 6px;
      border-top: 1px solid var(--border-base);
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .footer-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-success);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .footer span {
      color: var(--text-muted);
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .log-row { opacity: 1; transform: none; }
      .orb { animation: none; }
      .orb::before { animation: none; opacity: 0.4; }
      .status-dot { animation: none; opacity: 1; }
      .footer-dot { animation: none; opacity: 1; }
      .progress-fill::after { animation: none; }
    }
  </style>
</head>

<body>
  <div class="panel" id="splash">

    <!-- HEADER -->
    <div class="header">
      <div class="brand">
        <img id="brandLogo" class="brand-logo" src="../assets/images/icon-sombre.png" alt="Jarvis OS" />
        <div class="brand-info">
          <div class="brand-name">JARVIS OS</div>
          <div class="brand-sub">Intelligence Core</div>
        </div>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="badgeText">BOOT</span>
      </div>
    </div>

    <!-- ORB -->
    <div class="orb-container">
      <div class="orb" id="orb"></div>
    </div>

    <hr class="divider" />

    <!-- LOG -->
    <div class="log" id="log" role="log" aria-live="polite" aria-label="Boot sequence log"></div>

    <!-- PROGRESS -->
    <div class="progress-section">
      <div class="progress-meta">
        <div class="progress-label" id="statusText">Initialisation…</div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- METRICS -->
    <div class="metrics">
      <div class="metric">
        <span class="metric-label">CPU</span>
        <div class="metric-bar"><div class="fill" id="cpuFill"></div></div>
        <span class="value" id="cpuValue">0%</span>
      </div>
      <div class="metric">
        <span class="metric-label">MEM</span>
        <div class="metric-bar"><div class="fill" id="ramFill"></div></div>
        <span class="value" id="ramValue">0%</span>
      </div>
      <div class="metric">
        <span class="metric-label">T+</span>
        <span class="value" id="uptimeValue">0.0s</span>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="footer-left">
        <div class="footer-dot"></div>
        <span>SECURE</span>
      </div>
      <span>v0.4.0</span>
      <span>AES-256-GCM</span>
    </div>

  </div>

  <script>
    (function() {
      "use strict";

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Theme handling
      try {
        const brandLogo = document.getElementById('brandLogo');
        const savedTheme = localStorage.getItem("theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        const theme = (savedTheme === "dark" || savedTheme === "light")
          ? savedTheme
          : prefersLight ? "light" : "dark";

        document.documentElement.setAttribute("data-theme", theme);

        if (brandLogo) {
          brandLogo.src = theme === 'light'
            ? '../assets/images/icon-light.png'
            : '../assets/images/icon-sombre.png';
        }

        if (!savedTheme) {
          window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", (e) => {
            const next = e.matches ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            if (brandLogo) {
              brandLogo.src = next === 'light'
                ? '../assets/images/icon-light.png'
                : '../assets/images/icon-sombre.png';
            }
          });
        }
      } catch (_) {}

      // ===== BOOT STEPS =====
      const steps = [
        { label: "Chargement du noyau système",         duration: 280 },
        { label: "Initialisation des services IA",      duration: 350 },
        { label: "Connexion aux modules d'agents",      duration: 300 },
        { label: "Établissement du canal sécurisé",     duration: 260 },
        { label: "Vérification d'intégrité",            duration: 220 },
        { label: "Activation de l'interface",           duration: 200 },
        { label: "Synchronisation finale",              duration: 180 },
      ];

      // DOM refs
      const log = document.getElementById("log");
      const progressFill = document.getElementById("progressFill");
      const progressBar = document.getElementById("progressBar");
      const progressPct = document.getElementById("progressPct");
      const statusText = document.getElementById("statusText");
      const badgeText = document.getElementById("badgeText");
      const orb = document.getElementById("orb");
      const cpuFill = document.getElementById("cpuFill");
      const cpuValue = document.getElementById("cpuValue");
      const ramFill = document.getElementById("ramFill");
      const ramValue = document.getElementById("ramValue");
      const uptimeValue = document.getElementById("uptimeValue");

      function addRow(step) {
        const row = document.createElement("div");
        row.className = "log-row active";
        row.innerHTML = `
          <span class="log-icon">▸</span>
          <span class="log-label">${step.label}</span>
          <span class="log-status running">RUN</span>
        `;
        log.appendChild(row);
        return row;
      }

      function updateMetrics(elapsed, total) {
        const p = Math.min(1, elapsed / total);
        const cpu = Math.round(15 + 65 * Math.sin(p * Math.PI));
        cpuFill.style.width = cpu + "%";
        cpuValue.textContent = cpu + "%";

        const ram = Math.round(20 + 40 * p);
        ramFill.style.width = ram + "%";
        ramValue.textContent = ram + "%";

        uptimeValue.textContent = (elapsed / 1000).toFixed(1) + "s";
      }

      async function boot() {
        const total = steps.reduce((a, s) => a + s.duration, 0);
        let elapsed = 0;

        for (let i = 0; i < steps.length; i++) {
          const step = steps[i];
          const row = addRow(step);

          statusText.innerHTML = `<span class="accent">${step.label}</span>`;

          await new Promise(r => setTimeout(r, reduceMotion ? 0 : step.duration));
          elapsed += step.duration;

          updateMetrics(elapsed, total);

          // Mark done
          row.classList.remove("active");
          row.classList.add("done");
          row.querySelector(".log-icon").textContent = "✓";
          const st = row.querySelector(".log-status");
          st.textContent = "OK";
          st.className = "log-status ok";

          // Update progress
          const pct = Math.min(100, Math.round((elapsed / total) * 100));
          progressFill.style.width = pct + "%";
          progressPct.textContent = pct + "%";
          progressBar.setAttribute("aria-valuenow", String(pct));
        }

        // Boot complete
        statusText.innerHTML = `<span class="accent">Système opérationnel</span>`;
        progressPct.textContent = "100%";
        badgeText.textContent = "ONLINE";
        orb.classList.add("complete");

        // Final metrics
        cpuFill.style.width = "8%";
        cpuValue.textContent = "8%";
        ramFill.style.width = "38%";
        ramValue.textContent = "38%";

        // Keep uptime ticking
        let t = elapsed / 1000;
        setInterval(() => {
          t += 0.1;
          uptimeValue.textContent = t.toFixed(1) + "s";
        }, 100);
      }

      boot();
    })();
  </script>
</body>
</html>
